name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-debug-apk.yml'
  pull_request:
    paths:
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Diagnose YouTube extractor
        continue-on-error: true
        working-directory: android
        run: gradle --no-daemon --stacktrace testDebugUnitTest --tests com.qarro.livetranslator.YouTubeExtractorNetworkTest --info

      - name: Diagnose public proxy for reported video
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          video_id = "4uMSCFMNyP4"
          instances = [
              "https://inv.nadeko.net",
              "https://invidious.nerdvpn.de",
              "https://yt.chocolatemoo53.com",
              "https://invidious.tiekoetter.com",
          ]
          for base in instances:
              url = f"{base}/api/v1/videos/{video_id}?local=true"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "QarroCI/0.5.6", "Accept": "application/json"})
                  with urllib.request.urlopen(req, timeout=12) as r:
                      data = json.load(r)
                  fs = data.get("formatStreams") or []
                  af = data.get("adaptiveFormats") or []
                  hls = bool(data.get("hlsUrl"))
                  dash = bool(data.get("dashUrl"))
                  print(f"QARRO_PROXY_DIAG {base} HTTP 200 formatStreams={len(fs)} adaptive={len(af)} hls={hls} dash={dash}")
                  if fs or af or hls or dash:
                      print(f"QARRO_PROXY_DIAG SUCCESS {base}")
                      break
              except Exception as e:
                  print(f"QARRO_PROXY_DIAG {base} FAIL {type(e).__name__}: {e}")
          PY

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Show APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QarroLiveTranslator-v0.5.6-public-proxy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
